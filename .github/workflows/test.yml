name: TflJourneyPlanner UI tests

on:
  # Manual only: on GitHub-hosted runners, tfl.gov.uk shows a Cloudflare verification challenge
  # that stops the tests.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Google Chrome is preinstalled on the Ubuntu runner.
      - name: Run tests
        run: dotnet test --logger "trx;LogFileName=test_results.trx" --results-directory TestResults

      - name: Upload test results and artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/test_results.trx
            TflJourneyPlanner.Tests/bin/**/failure-evidence/
          if-no-files-found: ignore
